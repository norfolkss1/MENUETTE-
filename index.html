<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menuette — Chef's Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================== Connection status ============================== -->
<div id="status-banner" class="hidden"></div>

<!-- ============================== Access gate ============================== -->
<div id="gate-screen">
  <div class="center-screen">
    <div class="panel-card">
      <div class="brand-mark">Menuette</div>
      <div class="brand-sub">CHEF'S STUDIO</div>
      <input id="gate-pin" class="field" placeholder="Access code" type="password" inputmode="numeric" autocomplete="off">
      <div id="gate-error" class="error-text"></div>
      <button id="gate-unlock-btn" class="btn btn-primary btn-block">Unlock</button>
      <div class="hint-text">Ask whoever set up Menuette for the access code.</div>
    </div>
  </div>
</div>

<!-- ============================== Main app ============================== -->
<div id="app-shell" class="hidden">

  <aside id="sidebar">
    <div class="sb-brand">
      <div class="sb-brand-name">Menuette</div>
      <div class="sb-brand-sub">CHEF'S STUDIO</div>
    </div>

    <div class="sb-group-label">Menu Studios</div>
    <nav class="sb-nav">
      <button class="sb-item active" data-view="ddr"><span class="sb-ico">🍽️</span><span>DDR Menus</span></button>
      <button class="sb-item" data-view="buffet"><span class="sb-ico">🍱</span><span>Buffet Menus</span></button>
      <button class="sb-item" data-view="canape"><span class="sb-ico">🥂</span><span>Canapé Menus</span></button>
    </nav>

    <div class="sb-group-label">Kitchen</div>
    <nav class="sb-nav">
      <button class="sb-item" data-view="prep"><span class="sb-ico">🧾</span><span>Prep Vault</span><span class="sb-count" id="sb-prep-count"></span></button>
      <button class="sb-item" data-view="saved"><span class="sb-ico">📚</span><span>Saved Menus</span><span class="sb-count" id="sb-saved-count"></span></button>
      <button class="sb-item" data-view="import"><span class="sb-ico">📥</span><span>Import Menu</span></button>
    </nav>

    <div class="sb-foot">
      <div class="sb-stat"><span id="sb-dish-total">0</span> dishes in vault</div>
      <button id="lock-btn" class="btn btn-ghost btn-sm btn-block">Lock studio</button>
    </div>
  </aside>

  <main id="app-body">
    <div id="view-ddr"></div>
    <div id="view-buffet" class="hidden"></div>
    <div id="view-canape" class="hidden"></div>
    <div id="view-prep" class="hidden"></div>
    <div id="view-saved" class="hidden"></div>
    <div id="view-import" class="hidden"></div>
  </main>
</div>

<!-- ============================== Modal ============================== -->
<div id="modal-backdrop" class="modal-backdrop hidden">
  <div id="modal-card" class="modal-card"></div>
</div>

<!-- ============================== Toast ============================== -->
<div id="toast" class="hidden"></div>

<!-- ============================== Hidden print target ============================== -->
<div id="print-area"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.7.2/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="firebase-config.js"></script>
<script src="data/default-categories.js"></script>
<!-- app.js defines the shared state the other three read, so it must load first -->
<script src="app.js"></script>
<script src="studio.js"></script>
<script src="prep.js"></script>
<script src="pages.js"></script>
</body>
</html>
